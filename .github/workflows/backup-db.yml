name: Backup diário (Eva Lite)

# Exporta as tabelas de negócio (config, clients, faq, mensagens, etc. —
# ver scripts/backup_scheduled.js pra lista completa e o porquê) pra dentro
# de backups/latest/, comitado no próprio repositório privado. Existe
# porque o Postgres free do Supabase pausa depois de 7 dias sem atividade
# (retomar é grátis, mas a Eva "grande", C:\Sistemas\eva-test, já perdeu o
# Postgres free do Render sem aviso nenhum antes — mesmo tipo de risco).
#
# Precisa da secret DATABASE_URL configurada em Settings → Secrets and
# variables → Actions deste repositório (mesma connection string do .env).
on:
  schedule:
    - cron: '0 6 * * *'  # 03:00 BRT (Brasília é sempre UTC-3)
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev
      - name: Exportar tabelas
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/backup_scheduled.js
      - name: Commitar se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/latest
          git diff --staged --quiet || git commit -m "Backup automático $(date -u +%Y-%m-%d)"
          git push
